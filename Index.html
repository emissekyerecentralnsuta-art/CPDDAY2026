        <h1>CPD DAY 2026 &mdash; Monitoring Check Sheet</h1>
        <p>District: Sekyere Central &nbsp;|&nbsp; DEO Submission Form</p>
      </div>

      <div class="form-body">
        <form id="monitorForm">
          <div class="field">
            <label for="circuit">Circuit</label>
            <select id="circuit" required>
              <option value="">-- Select Circuit --</option>
            </select>
          </div>

          <div class="field">
            <label for="school">Name of School <span class="hint">(leave blank if entering a JHS below)</span></label>
            <select id="school" disabled>
              <option value="">-- Select Circuit First --</option>
            </select>
          </div>

          <div class="field">
            <label for="jhs">Name of JHS <span class="hint">(JHS schools are not in the list - type the name)</span></label>
            <input type="text" id="jhs" placeholder="Enter name of JHS" disabled>
          </div>

          <div class="row">
            <div class="field">
              <label for="siso">Name of SISO</label>
              <input type="text" id="siso" placeholder="Enter full name of SISO" required>
            </div>
            <div class="field">
              <label for="facilitator">Name of Facilitator</label>
              <input type="text" id="facilitator" placeholder="Enter full name of Facilitator">
            </div>
          </div>

          <div class="row">
            <div class="field">
              <label for="male">No. of Male Teachers Present</label>
              <input type="number" id="male" min="0" step="1" value="0" required>
            </div>
            <div class="field">
              <label for="female">No. of Female Teachers Present</label>
              <input type="number" id="female" min="0" step="1" value="0" required>
            </div>
          </div>

          <div class="field">
            <div class="total-box">
              <span>Total Teachers Present</span>
              <span class="value" id="totalDisplay">0</span>
            </div>
          </div>

          <div class="field">
            <label for="comment">General Comment / Observation</label>
            <textarea id="comment" rows="4" placeholder="Enter any general remarks or observations from the monitoring visit"></textarea>
          </div>

          <div class="actions">
            <button type="submit" id="submitBtn">Submit</button>
          </div>

          <div class="status" id="statusBox"></div>
          <div class="footer-note">Designed by OwaacsWood Graphics and Media.</div>
        </form>
      </div>
    </div>
  </div>

  <script>
    var schoolData = [];
    var circuitMap = {};

    var circuitSelect = document.getElementById('circuit');
    var schoolSelect = document.getElementById('school');
    var jhsInput = document.getElementById('jhs');
    var maleInput = document.getElementById('male');
    var femaleInput = document.getElementById('female');
    var totalDisplay = document.getElementById('totalDisplay');
    var statusBox = document.getElementById('statusBox');
    var submitBtn = document.getElementById('submitBtn');
    var form = document.getElementById('monitorForm');

    // Load circuit/school data from the server on page load.
    google.script.run
      .withSuccessHandler(initSchoolData)
      .withFailureHandler(function (err) {
        showStatus('Failed to load school list: ' + err.message, 'error');
      })
      .getSchoolData();

    function initSchoolData(data) {
      schoolData = data;
      circuitMap = {};

      data.forEach(function (row) {
        if (!circuitMap[row.circuit]) {
          circuitMap[row.circuit] = [];
        }
        circuitMap[row.circuit].push(row.school);
      });

      var circuits = Object.keys(circuitMap).sort();
      circuits.forEach(function (c) {
        var opt = document.createElement('option');
        opt.value = c;
        opt.textContent = c;
        circuitSelect.appendChild(opt);
      });
    }

    circuitSelect.addEventListener('change', function () {
      var circuit = circuitSelect.value;
      schoolSelect.innerHTML = '';

      jhsInput.disabled = !circuit;
      if (!circuit) {
        jhsInput.value = '';
      }

      if (!circuit) {
        schoolSelect.disabled = true;
        var placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.textContent = '-- Select Circuit First --';
        schoolSelect.appendChild(placeholder);
        return;
      }

      schoolSelect.disabled = false;
      var defaultOpt = document.createElement('option');
      defaultOpt.value = '';
      defaultOpt.textContent = '-- Select School --';
      schoolSelect.appendChild(defaultOpt);

      circuitMap[circuit].slice().sort().forEach(function (school) {
        var opt = document.createElement('option');
        opt.value = school;
        opt.textContent = school;
        schoolSelect.appendChild(opt);
      });
    });

    function updateTotal() {
      var m = parseInt(maleInput.value, 10) || 0;
      var f = parseInt(femaleInput.value, 10) || 0;
      totalDisplay.textContent = m + f;
    }
    maleInput.addEventListener('input', updateTotal);
    femaleInput.addEventListener('input', updateTotal);

    function showStatus(message, type) {
      statusBox.textContent = message;
      statusBox.className = 'status ' + type;
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      statusBox.className = 'status';

      var payload = {
        circuit: circuitSelect.value,
        school: schoolSelect.value,
        siso: document.getElementById('siso').value,
        facilitator: document.getElementById('facilitator').value,
        male: maleInput.value,
        female: femaleInput.value,
        comment: document.getElementById('comment').value,
        jhs: jhsInput.value
      };

      if (!payload.circuit) {
        showStatus('Please select a Circuit.', 'error');
        return;
      }
      if (!payload.school && !payload.jhs.trim()) {
        showStatus('Please select a School or enter a Name of JHS.', 'error');
        return;
      }
      if (!payload.siso.trim()) {
        showStatus('Please enter the Name of SISO.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';

      google.script.run
        .withSuccessHandler(function (result) {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Submit';
          showStatus('Record submitted successfully. Total teachers: ' + result.total, 'success');
          form.reset();
          schoolSelect.innerHTML = '<option value="">-- Select Circuit First --</option>';
          schoolSelect.disabled = true;
          jhsInput.disabled = true;
          updateTotal();
        })
        .withFailureHandler(function (err) {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Submit';
          showStatus('Error: ' + err.message, 'error');
        })
        .submitRecord(payload);
    });
  </script>
</body>
